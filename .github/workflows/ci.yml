name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Run Lint
        working-directory: backend
        run: npm run lint

      - name: Run Tests
        working-directory: backend
        run: npm test